---
source_files: [../src/staffRoll.cpp, ../src/staffRoll.S]
hooks:
  - name: StupidRedirect
    type: add_func_pointer
    src_addr_pal: 0x8098CD18
    target_func: 'dScRedirect_c::build(void)'

  # Fixes dScMovie_c references, since we override that
  - name: FixMovieRefs
    type: patch
    addr_pal: 0x80124DE0
    data: '48000028' # branch +0x28

  # Remove fader when calling startStaffCredit(), so the redirect transition time takes less
  - {name: NoStaffCreditFader, type: patch, addr_pal: 0x800BB8F0, data: '38600006'}

  - name: CircleWipeForNextGotoBlock
    type: branch_insn
    branch_type: bl
    src_addr_pal: 0x800530C0
    target_func: 'CircleWipeForNextGotoBlock'

  # Removes the special BG/lighting stuff used in the retail credits
  # (it causes graphical issues for most normal backgrounds)
  - {name: NoCreditStageSpecialEffect, type: patch, addr_pal: 0x8008934C, data: '38600000'}
  - {name: NoCreditStageSpecialEffect, type: patch, addr_pal: 0x801165C0, data: '38600000'}
